server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ВАЖНО: gzip здесь НЕ включаем.
    # Перед проектом стоит общий Caddy (см. DEPLOY_HYPEX.md, грабля №1):
    # если nginx проекта сожмёт крупный JS-бандл, Caddy отдаст клиенту
    # Content-Length: 0 и получится белый экран. Сжатие — на Caddy и Cloudflare.

    # Хэшированные ассеты Vite (index-XXXX.js) неизменяемы — кэшируем надолго.
    # Только add_header, без `expires`: директива expires добавляет свой
    # Cache-Control, и в ответе оказывались два конфликтующих заголовка.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя браузер продолжит грузить
    # старый html со ссылками на исчезнувшие ассеты.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API проксируем на backend-контейнер: Caddy шлёт весь трафик сюда,
    # а разводим /api/ уже здесь (паттерн barberos — предпочтительный
    # для новых fullstack-проектов по DEPLOY_HYPEX.md §1).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-check API — чтобы можно было проверить бэкенд снаружи.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback: любой неизвестный путь отдаёт index.html,
    # иначе прямой заход на /questions/foo вернул бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
