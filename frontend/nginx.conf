# Редиректы со слитых категорий (tools/consolidate-categories.sql, 2026-09-18).
# 26 категорий свели к 17: пары вида `kafka` + `kafka-advanced` были одной темой,
# разложенной по сложности, а для сложности есть отдельная ось Level.
#
# Старые URL остались в закладках и в поисковом индексе, поэтому отдаём 301,
# а не 404. И тем более не SPA-заглушку: без этого блока `location /` ниже
# вернул бы на /categories/kafka-advanced обычный index.html с кодом 200,
# то есть краулер увидел бы «страница жива», а пользователь — пустой список.
#
# `map` объявляется на уровне http, поэтому блок стоит вне server {}.
map $uri $merged_category {
    default                                 "";
    /categories/advanced-concurrency        /categories/multithreading;
    /categories/advanced-aspnet             /categories/aspnet-core;
    /categories/advanced-postgresql         /categories/postgresql;
    /categories/kafka-advanced              /categories/kafka;
    /categories/microservices-advanced      /categories/microservices;
    /categories/system-design-senior        /categories/system-design;
    /categories/devops-senior               /categories/devops;

    # Эти две разошлись по нескольким категориям, а редирект может вести
    # только в одну. Ведём туда, куда ушло большинство вопросов:
    # advanced-csharp — 19 из 25 в clr-gc, dotnet — 2 из 3 туда же.
    /categories/advanced-csharp             /categories/clr-gc;
    /categories/dotnet                      /categories/clr-gc;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Слитые категории — постоянный редирект на базовую (см. map выше).
    # Проверка на непустое значение: у всех остальных путей $merged_category
    # пустой, и редирект не срабатывает.
    #
    # Location — схемоотносительный (`//host/path`), а не голый путь.
    # На голом пути nginx сам достраивает абсолютный URL из $scheme, а TLS
    # здесь терминируется раньше (Cloudflare → Caddy по http → сюда),
    # поэтому $scheme всегда http и редирект уводил бы на http:// — лишний
    # хоп и даунгрейд схемы для краулера. Схемоотносительный URL браузер
    # разрешает той же схемой, с которой пришёл, и заголовки от прокси
    # для этого не нужны вовсе.
    if ($merged_category) {
        return 301 //$host$merged_category;
    }

    # ВАЖНО: gzip здесь НЕ включаем.
    # Перед проектом стоит общий Caddy (см. DEPLOY_HYPEX.md, грабля №1):
    # если nginx проекта сожмёт крупный JS-бандл, Caddy отдаст клиенту
    # Content-Length: 0 и получится белый экран. Сжатие — на Caddy и Cloudflare.

    # Хэшированные ассеты Vite (index-XXXX.js) неизменяемы — кэшируем надолго.
    # Только add_header, без `expires`: директива expires добавляет свой
    # Cache-Control, и в ответе оказывались два конфликтующих заголовка.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя браузер продолжит грузить
    # старый html со ссылками на исчезнувшие ассеты.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API проксируем на backend-контейнер: Caddy шлёт весь трафик сюда,
    # а разводим /api/ уже здесь (паттерн barberos — предпочтительный
    # для новых fullstack-проектов по DEPLOY_HYPEX.md §1).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Карта сайта живёт на бэкенде (генерируется из БД), но путь обязан быть
    # каноническим — /sitemap.xml, а не /api/sitemap.xml. Без этого блока
    # SPA-fallback ниже отдал бы на него index.html с кодом 200, и краулер
    # получал бы HTML вместо XML — ровно так и было до появления эндпоинта.
    location = /sitemap.xml {
        proxy_pass http://api:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-check API — чтобы можно было проверить бэкенд снаружи.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback: любой неизвестный путь отдаёт index.html,
    # иначе прямой заход на /questions/foo вернул бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
