<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Версия в имени файла, а не ?v=: Cloudflare кэширует favicon на 4 часа
         и параметр запроса не всегда считает частью ключа кэша. Смена имени
         гарантированно обходит и его кэш, и кэш браузера. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вопросы и ответы с собеседований: React, .NET, PostgreSQL, алгоритмы и системный дизайн. Подготовка по грейдам и компаниям." />
    <title>InterviewHub — подготовка к собеседованиям</title>
    <script>
      // Тема применяется до первой отрисовки — иначе при тёмной теме
      // страница успевает мигнуть светлым фоном.
      (function () {
        try {
          var stored = localStorage.getItem('ih-theme');
          var dark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* приватный режим — остаёмся на тёмной теме по умолчанию */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
